<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-loop-title agent-loop-desc">
      <title id="agent-loop-title">Agent loop</title>
      <desc id="agent-loop-desc">Flowchart of the diagnosis loop: initialise beliefs from priors, act when the action threshold is met, otherwise select the highest-information evidence, update by Bayes rule, and escalate when evidence runs out.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="448" y1="96" x2="448" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="200" x2="448" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="312" x2="672" y2="312" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="448" y1="368" x2="448" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="504" x2="448" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="608" x2="448" y2="628" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="692" x2="672" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- YES loop back to threshold diamond -->
      <path d="M 328,692 H 248 Q 240,692 240,684 V 320 Q 240,312 248,312 H 320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- labels -->
      <rect x="596" y="288" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="456" y="392" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="401" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="592" y="668" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="677" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="252" y="492" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="266" y="501" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- nodes -->
      <rect x="368" y="40" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI run failed</text>

      <rect x="320" y="144" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Initialise beliefs</text>
      <text x="448" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beliefs &lt;- priors P(S)</text>

      <polygon points="448,256 568,312 448,368 328,312" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="448" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Action threshold</text>
      <text x="448" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">met?</text>

      <rect x="680" y="284" width="192" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="776" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Take action</text>
      <text x="776" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">see &#167;5</text>

      <rect x="320" y="448" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Select next evidence</text>
      <text x="448" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">highest EIG given beliefs</text>

      <rect x="320" y="552" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Observe + Bayes update</text>
      <text x="448" y="592" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">normalise posterior</text>

      <polygon points="448,636 568,692 448,748 328,692" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evidence</text>
      <text x="448" y="704" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">remaining?</text>

      <rect x="680" y="664" width="192" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="776" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalate</text>
      <text x="776" y="704" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report + ranked posterior</text>
    </svg>
