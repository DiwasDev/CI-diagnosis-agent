<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p4-voi-title p4-voi-desc">
      <title id="p4-voi-title">P4 value-of-information policy</title>
      <desc id="p4-voi-desc">Flowchart of policy P4: compute each pending check's value of information, buy the highest while any is positive, and act on the cheapest action once nothing pays off.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="448" y1="104" x2="448" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="208" x2="448" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="320" x2="448" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="432" x2="648" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="488" x2="448" y2="560" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- buy loop back to compute -->
      <path d="M 720,404 V 240 Q 720,232 712,232 H 456 Q 448,232 448,240 V 256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- labels -->
      <rect x="584" y="408" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="456" y="508" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="570" y="204" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-CHECK</text>

      <!-- editorial callout -->
      <path d="M 572,612 Q 548,616 540,602" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="2,3"/>
      <text x="580" y="600" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">E3 passes in 33.8% of cases; E4 never &#8212;</text>
      <text x="580" y="620" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">its VoI is &#8722;$22.87 against a $33.33 price</text>

      <!-- nodes -->
      <rect x="368" y="48" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failure case</text>

      <rect x="348" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Observe free E1 + E2</text>

      <rect x="308" y="264" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compute VoI of each pending check</text>

      <polygon points="448,376 568,432 448,488 328,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any VoI &gt; 0?</text>

      <rect x="656" y="404" width="216" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="764" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Buy highest-VoI check</text>
      <text x="764" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">observe · Bayes update</text>

      <rect x="356" y="568" width="184" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="448" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act on cheapest</text>
      <text x="448" y="608" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never pays for useless bits</text>
    </svg>
