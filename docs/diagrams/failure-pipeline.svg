<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="failure-pipeline-title failure-pipeline-desc">
      <title id="failure-pipeline-title">Failure analysis pipeline</title>
      <desc id="failure-pipeline-desc">Pipeline showing how every misclassified case is ranked by realised cost, the top five get dry-run belief traces, and a ten-question diagnostic classifies them.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="208" y1="204" x2="224" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="392" y1="204" x2="416" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="204" x2="640" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="824" y1="204" x2="848" y2="204" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="312" y1="252" x2="312" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- branch labels -->
      <rect x="388" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="320" y="260" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- editorial callout -->
      <path d="M 700,308 Q 720,280 732,248" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="2,3"/>
      <text x="580" y="336" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">three of the five most expensive failures share one trace:</text>
      <text x="580" y="356" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">a dependency failure crashing the lint step</text>

      <!-- nodes -->
      <rect x="32" y="168" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">500 cases</text>
      <text x="120" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&#215; policy under test</text>

      <polygon points="312,156 392,204 312,252 232,204" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wrong action?</text>

      <rect x="248" y="296" width="128" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Correct</text>
      <text x="312" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no action needed</text>

      <rect x="424" y="168" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rank failures</text>
      <text x="520" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by realised cost</text>

      <rect x="648" y="168" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="736" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry-run top 5</text>
      <text x="736" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">belief-by-belief trace</text>

      <rect x="856" y="168" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="952" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Classify + report</text>
      <text x="952" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10-question diagnostic</text>
    </svg>
