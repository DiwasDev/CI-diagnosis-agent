<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2-band-title p2-band-desc">
      <title id="p2-band-title">P2 expected-cost threshold policy</title>
      <desc id="p2-band-desc">Flowchart of policy P2: observe free evidence, compute each action's expected cost, and escalate when the cost gap is under five dollars or no state reaches 55 percent belief.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="448" y1="104" x2="448" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="216" x2="448" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="328" x2="448" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="440" x2="664" y2="440" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="448" y1="496" x2="448" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- branch labels -->
      <rect x="592" y="416" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="456" y="516" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="525" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- editorial callout -->
      <path d="M 700,488 Q 716,520 748,536" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="2,3"/>
      <text x="596" y="484" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">the $5 / 55% band was a guess &#8212;</text>
      <text x="596" y="504" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Fix 3 derives it from the costs</text>

      <!-- nodes -->
      <rect x="368" y="48" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failure case</text>

      <rect x="348" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Observe free E1 + E2</text>

      <rect x="332" y="272" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expected cost of each action</text>

      <polygon points="448,384 568,440 448,496 328,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cost gap &lt; $5</text>
      <text x="448" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">or belief &lt; 55%?</text>

      <rect x="672" y="412" width="176" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="760" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalate &#8212; $50.00</text>
      <text x="760" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">44.6% of cases</text>

      <rect x="356" y="576" width="184" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="600" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act on cheapest</text>
      <text x="448" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lowest expected cost</text>
    </svg>
