<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1168 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-tree-title state-tree-desc">
      <title id="state-tree-title">Hidden-state taxonomy</title>
      <desc id="state-tree-desc">Tree showing the seven hidden root-cause states collapsed from 16 failure types, grouped under the three repair actions: fix code, fix dependency, and escalate.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors (before nodes) -->
      <line x1="616" y1="88" x2="616" y2="132" stroke="#7a8399" stroke-width="1"/>
      <line x1="312" y1="132" x2="920" y2="132" stroke="#7a8399" stroke-width="1"/>
      <line x1="312" y1="132" x2="312" y2="168" stroke="#7a8399" stroke-width="1"/>
      <line x1="624" y1="132" x2="624" y2="168" stroke="#7a8399" stroke-width="1"/>
      <line x1="920" y1="132" x2="920" y2="168" stroke="#7a8399" stroke-width="1"/>

      <line x1="312" y1="232" x2="312" y2="284" stroke="#7a8399" stroke-width="1"/>
      <line x1="168" y1="284" x2="456" y2="284" stroke="#7a8399" stroke-width="1"/>
      <line x1="168" y1="284" x2="168" y2="328" stroke="#7a8399" stroke-width="1"/>
      <line x1="312" y1="284" x2="312" y2="328" stroke="#7a8399" stroke-width="1"/>
      <line x1="456" y1="284" x2="456" y2="328" stroke="#7a8399" stroke-width="1"/>

      <line x1="624" y1="232" x2="624" y2="328" stroke="#7a8399" stroke-width="1"/>

      <line x1="920" y1="232" x2="920" y2="284" stroke="#7a8399" stroke-width="1"/>
      <line x1="776" y1="284" x2="1064" y2="284" stroke="#7a8399" stroke-width="1"/>
      <line x1="776" y1="284" x2="776" y2="328" stroke="#7a8399" stroke-width="1"/>
      <line x1="920" y1="284" x2="920" y2="328" stroke="#7a8399" stroke-width="1"/>
      <line x1="1064" y1="284" x2="1064" y2="328" stroke="#7a8399" stroke-width="1"/>

      <!-- root (focal) -->
      <rect x="544" y="32" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="32" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="616" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 hidden states</text>
      <text x="616" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from 16 failure types</text>

      <!-- action groups -->
      <rect x="228" y="176" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fix Code</text>
      <text x="312" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">correct for S1 S2 S4</text>

      <rect x="544" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fix Dependency</text>
      <text x="624" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">correct for S3</text>

      <rect x="844" y="176" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="920" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalate</text>
      <text x="920" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">correct for S5 S6 S7</text>

      <!-- Fix Code leaves -->
      <rect x="108" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="168" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S1 source</text>
      <text x="168" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P1</text>

      <rect x="252" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="312" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S2 config</text>
      <text x="312" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P2</text>

      <rect x="396" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="456" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S4 static</text>
      <text x="456" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P5 + P6</text>

      <!-- Fix Dependency leaf -->
      <rect x="560" y="336" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="624" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S3 dependency</text>
      <text x="624" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P3 + P4</text>

      <!-- Escalate leaves -->
      <rect x="716" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="776" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S5 tests</text>
      <text x="776" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P8</text>

      <rect x="860" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="920" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S6 env</text>
      <text x="920" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W4</text>

      <rect x="1004" y="336" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="1064" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S7 other</text>
      <text x="1064" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 residual types</text>
    </svg>
