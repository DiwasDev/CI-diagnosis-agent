<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-infogain-title p3-infogain-desc">
      <title id="p3-infogain-title">P3 information-gain-per-dollar policy</title>
      <desc id="p3-infogain-desc">Flowchart of policy P3: rank paid checks by information gain per dollar, buy while the score beats 0.05 bits per dollar, then act or escalate.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="448" y1="104" x2="448" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="208" x2="448" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="448" y1="320" x2="448" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="432" x2="648" y2="432" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="448" y1="488" x2="448" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- buy loop back to rank -->
      <path d="M 720,404 V 240 Q 720,232 712,232 H 456 Q 448,232 448,240 V 256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- labels -->
      <rect x="584" y="408" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="456" y="508" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="562" y="204" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT CHECK</text>

      <!-- editorial callout -->
      <path d="M 800,540 Q 790,500 772,468" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="2,3"/>
      <text x="624" y="580" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">E3 scores 1.72 bits/$ &#8212; bought in</text>
      <text x="624" y="600" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">100% of cases, useful or not</text>

      <!-- nodes -->
      <rect x="368" y="48" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failure case</text>

      <rect x="348" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Observe free E1 + E2</text>

      <rect x="320" y="264" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rank paid checks by EIG / $</text>

      <polygon points="448,376 568,432 448,488 328,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Best score &gt; 0.05</text>
      <text x="448" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bits / $ ?</text>

      <rect x="656" y="404" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="764" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Buy, observe, update</text>
      <text x="764" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">belief &lt;- Bayes(prior, evidence)</text>

      <rect x="356" y="568" width="184" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act or escalate</text>
      <text x="448" y="608" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argmin expected cost</text>
    </svg>
