<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CI Diagnosis Agent</p>
    <h1>One Bayesian core, five policies on top</h1>

    <svg viewBox="0 0 1000 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-core-title agent-core-desc">
      <title id="agent-core-title">CI diagnosis agent core</title>
      <desc id="agent-core-desc">Architecture showing free evidence (pipeline step, changed files) and paid evidence (rerun, local repro) feeding a Bayes update, whose posterior drives a policy that either acts or buys more evidence.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (painted first) ============ -->
      <rect x="32" y="88" width="224" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="92" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="144" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FREE EVIDENCE · $0</text>

      <rect x="32" y="448" width="224" height="224" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="452" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="144" y="461" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PAID EVIDENCE</text>

      <!-- ============ ARROWS (before nodes) ============ -->
      <!-- Priors -> Bayes -->
      <line x1="416" y1="88" x2="416" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E1 -> Bayes -->
      <line x1="232" y1="180" x2="312" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E2 -> Bayes (elbow) -->
      <path d="M 232,300 H 288 Q 296,300 296,292 V 252 Q 296,244 304,244 H 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bayes -> Posterior -->
      <line x1="512" y1="220" x2="552" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Posterior -> Policy -->
      <line x1="704" y1="220" x2="744" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Policy -> Actions (accent: the commit) -->
      <path d="M 768,248 V 292 Q 768,300 760,300 H 640 Q 632,300 632,308 V 328" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- E3 -> Bayes (observe, dashed) -->
      <path d="M 112,496 V 316 Q 112,308 120,308 H 344 Q 352,308 352,300 V 272" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E4 -> Bayes (observe, dashed, hops over E3->Policy run) -->
      <path d="M 144,584 V 540 H 400 V 536 a 8,8 0 0,1 0,-16 V 272" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E3 -> Policy (buy, dashed) -->
      <path d="M 232,528 H 792 Q 800,528 800,520 V 256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E4 -> Policy (buy, dashed) -->
      <path d="M 232,616 H 856 Q 864,616 864,608 V 256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (masked, 8px gap) ============ -->
      <rect x="360" y="276" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="386" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVE</text>

      <rect x="412" y="388" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="438" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVE</text>

      <rect x="476" y="508" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUY IF VOI&gt;0</text>

      <rect x="508" y="596" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="548" y="605" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUY IF VOI&gt;0</text>

      <!-- ============ NODES ============ -->
      <!-- Priors (store) -->
      <rect x="320" y="32" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="32" width="192" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="416" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Priors P(S1&#8230;S7)</text>
      <text x="416" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">counted from 567 cases</text>

      <!-- E1 (input) -->
      <rect x="56" y="136" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="136" width="176" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="144" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E1 first failed step</text>
      <text x="144" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">install&#8230;other · $0</text>

      <!-- E2 (input) -->
      <rect x="56" y="256" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="256" width="176" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="144" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E2 changed files</text>
      <text x="144" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7 file categories · $0</text>

      <!-- Bayes update (focal) -->
      <rect x="320" y="176" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="176" width="192" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="416" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bayes update</text>
      <text x="416" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">posterior &#8733; prior &#215; likelihood</text>

      <!-- Posterior (store) -->
      <rect x="560" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="192" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="632" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Posterior</text>
      <text x="632" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">belief over states</text>

      <!-- Policy (backend) -->
      <rect x="752" y="192" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Policy rule</text>
      <text x="832" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argmin expected cost</text>

      <!-- Actions (backend) -->
      <rect x="560" y="336" width="144" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actions</text>
      <text x="632" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Fix Code · $8.33</text>
      <text x="632" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Fix Dependency · $8.33</text>
      <text x="632" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Escalate · $50.00</text>

      <!-- E3 (optional/paid) -->
      <rect x="56" y="496" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="496" width="176" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="144" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E3 rerun outcome</text>
      <text x="144" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$0.07 · 12 min runner</text>

      <!-- E4 (optional/paid) -->
      <rect x="56" y="584" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="584" width="176" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="144" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E4 local repro</text>
      <text x="144" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$33.33 · 20 min dev</text>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="696" x2="968" y2="696" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="708" width="24" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="160" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FREE INPUT</text>
      <rect x="288" y="708" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="320" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BAYES CORE</text>
      <rect x="464" y="708" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="496" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STATE</text>
      <rect x="600" y="708" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="632" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAID CHECK</text>
      <line x1="776" y1="716" x2="800" y2="716" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="812" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONDITIONAL</text>
    </svg>
  </div>
</body>
</html>
